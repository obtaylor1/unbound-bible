name: Private staging

on:
  workflow_run:
    workflows: ["Quality"]
    types: [completed]
    branches: [main]

concurrency:
  group: private-staging
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      api_image: ${{ steps.images.outputs.api_image }}
      web_image: ${{ steps.images.outputs.web_image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Authenticate to the GitHub container registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build and publish commit images
        id: images
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          api_repository="ghcr.io/${repository}-api"
          web_repository="ghcr.io/${repository}-web"
          api_tag="${api_repository}:${RELEASE_SHA}"
          web_tag="${web_repository}:${RELEASE_SHA}"

          docker build --file backend/Dockerfile --tag "$api_tag" .
          docker push "$api_tag"
          docker build --file frontend/Dockerfile --tag "$web_tag" .
          docker push "$web_tag"

          api_digest="$(docker buildx imagetools inspect "$api_tag" --format '{{.Manifest.Digest}}')"
          web_digest="$(docker buildx imagetools inspect "$web_tag" --format '{{.Manifest.Digest}}')"
          test -n "$api_digest"
          test -n "$web_digest"
          echo "api_image=${api_repository}@${api_digest}" >> "$GITHUB_OUTPUT"
          echo "web_image=${web_repository}@${web_digest}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    steps:
      - name: Invoke the configured provider deploy hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.STAGING_DEPLOY_HOOK_URL }}
          API_IMAGE: ${{ needs.build.outputs.api_image }}
          WEB_IMAGE: ${{ needs.build.outputs.web_image }}
        run: |
          test -n "$DEPLOY_HOOK_URL"
          test -n "$API_IMAGE"
          test -n "$WEB_IMAGE"
          payload="$(jq -n \
            --arg sha "$RELEASE_SHA" \
            --arg api_image "$API_IMAGE" \
            --arg web_image "$WEB_IMAGE" \
            '{sha: $sha, api_image: $api_image, web_image: $web_image}')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --data "$payload" \
            --url "$DEPLOY_HOOK_URL"
